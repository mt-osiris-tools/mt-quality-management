# Pytest Configuration for Document Control Process
[pytest]

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution options
addopts =
    # Verbose output
    --verbose
    # Show local variables in tracebacks
    --showlocals
    # Coverage reporting
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Fail if coverage below threshold
    --cov-fail-under=80
    # Stop on first failure (optional, comment out for CI)
    # --maxfail=1
    # Show slowest tests
    --durations=10
    # Strict markers
    --strict-markers
    # Warnings as errors (strict mode)
    -W error
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

# Test markers for categorization
markers =
    security: Security-focused tests (authentication, authorization, encryption)
    integration: Integration tests (API endpoints, database)
    unit: Unit tests (business logic, services)
    contract: Contract tests (API schema validation)
    slow: Slow-running tests (performance, load testing)
    smoke: Smoke tests (basic functionality checks)

# Asyncio mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function


# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */conftest.py
    */__init__.py
    */alembic/*

[coverage:report]
exclude_lines =
    # Exclude from coverage
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
