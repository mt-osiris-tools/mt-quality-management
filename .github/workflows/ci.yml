name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 001-document-control

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Static checks
        run: |
          python -m compileall -q main.py src scripts tests
          black --check main.py src scripts tests
          isort --check-only main.py src scripts tests
          flake8 main.py src scripts tests
          mypy --ignore-missing-imports main.py src

      - name: Unit tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          ENCRYPTION_KEY_LEVEL_1: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          ENCRYPTION_KEY_LEVEL_2: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          ENCRYPTION_KEY_LEVEL_3: "cccccccccccccccccccccccccccccccccccccccccccc"
          JWT_PUBLIC_KEY: "test-public-key"
          APP_ENV: "test"
        run: pytest

      - name: Security checks
        run: |
          bandit -c .bandit -r src
          safety check -r requirements.txt -r requirements-dev.txt
